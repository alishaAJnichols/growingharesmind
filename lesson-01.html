<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowingHare'sMind — Lesson 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --meadow:#EEF2E6;
    --meadow-deep:#DCE6CE;
    --clover:#5C7A54;
    --clover-deep:#3F5A3A;
    --butter:#F4C95D;
    --carrot:#E8823C;
    --carrot-deep:#C4671F;
    --clay:#4A4036;
    --clay-soft:#7A6F60;
    --white:#FFFDF8;
    --radius-lg:20px;
    --radius-md:14px;
  --clover-basket:#8FAE7F;
  --clover-basket-deep:#5C7A54;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--meadow);
    color:var(--clay);
    font-family:'Atkinson Hyperlegible', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  h1,.display{ font-family:'Fredoka', sans-serif; font-weight:600; color:var(--clover-deep); margin:0; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  button:focus-visible{ outline:3px solid var(--butter); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  header{
    width:100%; max-width:640px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand span{ font-family:'Fredoka', sans-serif; font-weight:700; font-size:17px; color:var(--clover-deep); }
  .level-tag{
    font-size:12px; font-weight:700; color:var(--clover);
    background:var(--meadow-deep); padding:5px 12px; border-radius:999px;
  }

  .caption{
    font-size:15px; color:var(--clay-soft); text-align:center;
    max-width:420px; margin-bottom:28px;
  }

  /* ---------- the scene ---------- */
  .scene{
    width:100%; max-width:640px;
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:36px 28px 28px;
    box-shadow:0 14px 34px -18px rgba(63,90,58,.3);
    position:relative;
  }

  .branch{
    position:relative;
    height:220px;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .branch-line{
    position:absolute; top:0; left:10%; right:10%; height:8px;
    background:#8A6E4B; border-radius:4px;
  }
  .fulcrum{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:20px solid #8A6E4B;
    margin-top:6px;
  }
  .beam{
    position:absolute; top:24px; left:50%;
    width:78%; height:6px;
    background:#A9835A; border-radius:3px;
    transform-origin:center center;
    transform:rotate(var(--tilt,0deg)) translateX(-50%);
    transition:transform .5s cubic-bezier(.34,1.4,.4,1);
  }
  .pan-wrap{
    position:absolute; top:24px;
    display:flex; flex-direction:column; align-items:center;
    transition:transform .5s cubic-bezier(.34,1.4,.4,1);
  }
  .pan-wrap.left{ left:11%; transform:translate(-50%, calc(var(--liftL,0px))); }
  .pan-wrap.right{ left:89%; transform:translate(-50%, calc(var(--liftR,0px))); }
  .string{ width:2px; height:34px; background:#A9835A; }
  .basket{
    width:130px; min-height:90px;
    background:var(--clover-basket);
    border:3px solid var(--clover-basket-deep);
    border-radius:10px 10px 16px 16px;
    display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center;
    gap:6px;
    padding:10px 8px;
  }
  .basket.mystery-basket{ background:var(--paw,#C9BFE0); border-color:#9D8DC4; }

  .carrot{
    width:22px; height:22px;
    cursor:pointer;
    transition:transform .12s ease, opacity .2s ease;
  }
  .carrot:hover{ transform:scale(1.12); }
  .carrot:active{ transform:scale(.9); }
  .carrot.leaving{ opacity:0; transform:scale(.4) translateY(-14px); }

  .mystery-bag{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--white);
    border:2.5px dashed #9D8DC4;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka', sans-serif;
    font-weight:600; font-size:20px;
    color:#7A6BA8;
  }

  .basket-label{
    text-align:center; font-size:12px; color:var(--clay-soft); margin-top:8px;
  }

  /* ---------- mascot & note ---------- */
  .mascot-row{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:26px;
  }
  .mascot{
    width:52px; height:52px; border-radius:50%;
    background:var(--meadow-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:transform .3s ease;
  }
  .mascot.wiggle{ animation:wiggle .5s ease; }
  @keyframes wiggle{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg)} 75%{transform:rotate(8deg)} }
  .note{ font-size:14px; color:var(--clay-soft); min-height:20px; }

  /* ---------- effort meter ---------- */
  .meter-row{ width:100%; max-width:640px; margin-top:22px; }
  .meter-label-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--clay-soft); margin-bottom:6px; }
  .meter{ height:12px; border-radius:999px; background:var(--meadow-deep); overflow:hidden; }
  .meter i{ display:block; height:100%; width:0%; background:var(--butter); border-radius:999px; transition:width .4s ease; }

  .controls{ display:flex; gap:12px; margin-top:22px; }
  .btn{
    padding:11px 20px; border-radius:999px; font-weight:700; font-size:14px;
    transition:transform .15s ease;
  }
  .btn:active{ transform:translateY(2px); }
  .btn-reset{ background:transparent; border:2px solid var(--meadow-deep); color:var(--clover-deep); }
  .btn-hint{ background:var(--butter); color:var(--clay); display:none; }
  .btn-hint.show{ display:inline-block; }

  .celebrate{
    display:none;
    text-align:center; margin-top:20px;
    font-family:'Fredoka', sans-serif; font-weight:600; font-size:20px;
    color:var(--clover-deep);
  }
  .celebrate.show{ display:block; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <circle cx="17" cy="19" r="10" fill="#FFFDF8" stroke="#3F5A3A" stroke-width="2"/>
      <path d="M10 10 C8 3, 13 2, 13 9" stroke="#3F5A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M24 10 C26 3, 21 2, 21 9" stroke="#3F5A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="13" cy="18" r="3.4" fill="none" stroke="#4A4036" stroke-width="1.6"/>
      <circle cx="21" cy="18" r="3.4" fill="none" stroke="#4A4036" stroke-width="1.6"/>
    </svg>
    <span>GrowingHare'sMind</span>
  </div>
  <span class="level-tag">European hare · Level 1</span>
</header>

<p class="caption">Tap one. Take it off. Make both sides the same.</p>

<div class="scene">
  <div class="branch">
    <div class="branch-line"></div>
    <div class="fulcrum"></div>
    <div class="beam" id="beam"></div>

    <div class="pan-wrap left" id="panWrapLeft">
      <div class="string"></div>
      <div class="basket mystery-basket" id="leftBasket">
        <div class="mystery-bag" id="mysteryBag">?</div>
      </div>
      <div class="basket-label">Mystery + clover</div>
    </div>

    <div class="pan-wrap right" id="panWrapRight">
      <div class="string"></div>
      <div class="basket" id="rightBasket"></div>
      <div class="basket-label">Clover</div>
    </div>
  </div>

  <div class="mascot-row">
    <div class="mascot" id="mascot">
      <svg width="30" height="30" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <circle cx="17" cy="19" r="9" fill="#FFFDF8" stroke="#3F5A3A" stroke-width="1.8"/>
        <path d="M11 11 C9.5 5.5, 13 4.5, 13 10.5" stroke="#3F5A3A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M23 11 C24.5 5.5, 21 4.5, 21 10.5" stroke="#3F5A3A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="13.5" cy="18" r="2.6" fill="#3F5A3A"/>
        <circle cx="20.5" cy="18" r="2.6" fill="#3F5A3A"/>
      </svg>
    </div>
    <p class="note" id="note">Tap to try.</p>
  </div>

  <div class="celebrate" id="celebrate">🍀 Yes! It was 4!</div>
</div>

<div class="meter-row">
  <div class="meter-label-row"><span>Effort meter</span><span id="meterCount">0 tries</span></div>
  <div class="meter"><i id="meterFill"></i></div>
</div>

<div class="controls">
  <button class="btn btn-reset" id="resetBtn">Try again — it still counts</button>
  <button class="btn btn-hint" id="hintBtn">Help me</button>
</div>

<script>
  const MYSTERY_VALUE = 4;
  let leftUnits = 3;
  let rightUnits = 7;
  let totalTaps = 0;
  let hintShown = false;
  let won = false;

  const leftBasket = document.getElementById('leftBasket');
  const rightBasket = document.getElementById('rightBasket');
  const mysteryBag = document.getElementById('mysteryBag');
  const beam = document.getElementById('beam');
  const panWrapLeft = document.getElementById('panWrapLeft');
  const panWrapRight = document.getElementById('panWrapRight');
  const mascot = document.getElementById('mascot');
  const note = document.getElementById('note');
  const meterFill = document.getElementById('meterFill');
  const meterCount = document.getElementById('meterCount');
  const hintBtn = document.getElementById('hintBtn');
  const resetBtn = document.getElementById('resetBtn');
  const celebrate = document.getElementById('celebrate');

  function cloverSVG(){
    return `<svg class="carrot" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 12 C12 8, 8 6, 6 9 C4 12, 8 14, 12 12 Z" fill="#5C7A54" stroke="#3F5A3A" stroke-width="0.8"/>
      <path d="M12 12 C12 8, 16 6, 18 9 C20 12, 16 14, 12 12 Z" fill="#6C8C62" stroke="#3F5A3A" stroke-width="0.8"/>
      <path d="M12 12 C8 12, 6 16, 9 18 C12 20, 14 16, 12 12 Z" fill="#5C7A54" stroke="#3F5A3A" stroke-width="0.8"/>
      <line x1="12" y1="12" x2="12" y2="19" stroke="#3F5A3A" stroke-width="1"/>
    </svg>`;
  }

  function render(){
    // rebuild left basket
    leftBasket.innerHTML = '';
    leftBasket.appendChild(mysteryBag);
    for(let i=0;i<leftUnits;i++){
      const d = document.createElement('div');
      d.innerHTML = cloverSVG();
      const el = d.firstElementChild;
      el.addEventListener('click', () => removeOne('left'));
      leftBasket.appendChild(el);
    }
    // rebuild right basket
    rightBasket.innerHTML = '';
    for(let i=0;i<rightUnits;i++){
      const d = document.createElement('div');
      d.innerHTML = cloverSVG();
      const el = d.firstElementChild;
      el.addEventListener('click', () => removeOne('right'));
      rightBasket.appendChild(el);
    }

    // physics: true weight uses the hidden mystery value
    const trueLeft = MYSTERY_VALUE + leftUnits;
    const trueRight = rightUnits;
    const diff = trueRight - trueLeft; // positive => right heavier => right dips
    const angle = Math.max(-14, Math.min(14, diff * 3.2));
    beam.style.setProperty('--tilt', angle + 'deg');
    panWrapLeft.style.setProperty('--liftL', (-angle * 1.6) + 'px');
    panWrapRight.style.setProperty('--liftR', (angle * 1.6) + 'px');

    // effort meter — fills with total taps, caps visually at 12 taps for a full bar
    const pct = Math.min(100, (totalTaps / 12) * 100);
    meterFill.style.width = pct + '%';
    meterCount.textContent = totalTaps + (totalTaps === 1 ? ' try' : ' tries');

    if(totalTaps >= 4 && !hintShown && !won){
      hintBtn.classList.add('show');
    }

    if(leftUnits === 0 && rightUnits === MYSTERY_VALUE && !won){
      handleWin();
    }
  }

  function removeOne(side){
    if(won) return;
    if(side === 'left'){
      if(leftUnits <= 0) return;
      leftUnits--;
    } else {
      if(rightUnits <= 0) return;
      rightUnits--;
    }
    totalTaps++;
    mascot.classList.remove('wiggle');
    void mascot.offsetWidth;
    mascot.classList.add('wiggle');

    const trueLeft = MYSTERY_VALUE + leftUnits;
    const trueRight = rightUnits;
    if(trueLeft === trueRight){
      note.textContent = "Good — even.";
    } else {
      note.textContent = "Hmm — that tipped a bit. Try taking one from the other side too.";
    }
    render();
  }

  function handleWin(){
    won = true;
    note.textContent = "Even!";
    mysteryBag.textContent = MYSTERY_VALUE;
    mysteryBag.style.color = 'var(--clover-deep)';
    mysteryBag.style.borderStyle = 'solid';
    mysteryBag.style.borderColor = 'var(--clover)';
    celebrate.classList.add('show');
    hintBtn.classList.remove('show');
  }

  hintBtn.addEventListener('click', () => {
    hintShown = true;
    hintBtn.classList.remove('show');
    leftBasket.style.outline = '3px solid var(--butter)';
    rightBasket.style.outline = '3px solid var(--butter)';
    note.textContent = "Try one from each side.";
    setTimeout(() => {
      leftBasket.style.outline = 'none';
      rightBasket.style.outline = 'none';
    }, 1800);
  });

  resetBtn.addEventListener('click', () => {
    leftUnits = 3;
    rightUnits = 7;
    won = false;
    hintShown = false;
    mysteryBag.textContent = '?';
    mysteryBag.style.color = '';
    mysteryBag.style.borderStyle = 'dashed';
    mysteryBag.style.borderColor = '#9D8DC4';
    celebrate.classList.remove('show');
    note.textContent = "New try. It still counts.";
    render();
  });

  render();
</script>
</body>
</html>
